# AI Vault on one server, one copy per environment.
#
#   docker compose -p aivault-staging    --env-file /opt/aivault/staging/.env    -f compose.yml up -d
#   docker compose -p aivault-production --env-file /opt/aivault/production/.env -f compose.yml up -d
#
# The project name (-p) gives each environment its own containers, network
# and volumes; its .env gives it its own database, Redis, S3 bucket,
# secrets, Google OAuth client and public port. Nothing is shared between
# the two copies but the machine. Only `web` publishes a port; the
# database, Redis, API and workers are reachable from inside their own
# environment's network only.

x-app-env: &app-env
  env_file:
    - ${APP_ENV_FILE:?set APP_ENV_FILE to this environment's .env}
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://aivault:${POSTGRES_PASSWORD:?}@postgres:5432/aivault
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    # Amazon S3, one private bucket per environment, reached with that
    # environment's own access keys (scoped to its bucket only).
    OBJECT_STORAGE_ENDPOINT_URL: ""
    OBJECT_STORAGE_SECURE: "true"
    OBJECT_STORAGE_BUCKET: ${ARCHIVE_BUCKET:?}
    AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
    # Everything that names the public address derives from PUBLIC_URL, so
    # moving from an IP to CloudFront or a domain is a one-line change.
    FRONTEND_URL: ${PUBLIC_URL:?}
    CORS_ALLOW_ORIGINS: ${PUBLIC_URL}
    GOOGLE_WORKSPACE_REDIRECT_URI: ${PUBLIC_URL}/connectors/google/callback
    COOKIE_SECURE: "true"
    ARCHIVE_TEMP_DIR: /archive-tmp
    # In the .env for nginx and backup.sh only — the app never gets them.
    ORIGIN_VERIFY_SECRET: ""
    BACKUP_AWS_ACCESS_KEY_ID: ""
    BACKUP_AWS_SECRET_ACCESS_KEY: ""
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aivault
      POSTGRES_USER: aivault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivault -d aivault"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}

  # Brings the database schema up to date, then exits. Every other app
  # service waits for it, so a release never runs against an old schema.
  migrate:
    <<: *app-env
    image: aivault-backend:${IMAGE_TAG:?}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app-env
    image: aivault-backend:${IMAGE_TAG}
    # --proxy-headers: the client address comes from `web` (nginx), which
    # sets it; the API is reachable from nothing else.
    command:
      [
        "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
        "--workers", "${API_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "*",
      ]
    volumes:
      # The ~128 MB embedding model, downloaded once rather than on every start.
      - model-cache:/home/vault_app/gensim-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      # The very first start downloads the model before it answers.
      start_period: 300s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}

  worker:
    <<: *app-env
    image: aivault-worker:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command:
      [
        "celery", "-A", "worker.celery_app", "worker", "--loglevel=info",
        "--concurrency", "${WORKER_CONCURRENCY:-2}",
      ]
    volumes:
      # Archives are assembled here before upload; the worker refuses a job
      # that would leave less than ARCHIVE_FREE_SPACE_RESERVE_BYTES free.
      - archive-tmp:/archive-tmp
      - model-cache:/home/vault_app/gensim-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: ${WORKER_MEM_LIMIT:-1536m}

  # Celery Beat: enqueues scheduled work, runs nothing itself. Exactly one
  # per environment — never scale it.
  scheduler:
    <<: *app-env
    image: aivault-worker:${IMAGE_TAG}
    command:
      [
        "celery", "-A", "worker.celery_app", "beat", "--loglevel=info",
        "--schedule", "/tmp/celerybeat-schedule",
      ]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: ${SCHEDULER_MEM_LIMIT:-320m}

  web:
    image: aivault-web-${ENVIRONMENT_NAME:?}:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
    environment:
      BACKEND_UPSTREAM: backend:8000
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
    ports:
      - "${WEB_PORT:?}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

volumes:
  postgres-data:
  redis-data:
  archive-tmp:
  model-cache:
