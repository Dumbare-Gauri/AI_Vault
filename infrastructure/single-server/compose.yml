# One AI Vault environment on its own EC2 instance (staging and production
# each get one):
#
#   docker compose -p aivault-<env> --env-file /opt/aivault/<env>/.env -f compose.yml up -d
#
# Its .env gives it its own database, Redis, S3 buckets, secrets, Google
# OAuth client and public address. Only `edge` (Caddy, HTTPS) is reachable
# from outside; `web` (nginx) listens on the server's loopback for
# deploy.sh's health check; the database, Redis, API and workers are
# reachable from inside this environment's network only.

x-app-env: &app-env
  env_file:
    - ${APP_ENV_FILE:?set APP_ENV_FILE to this environment's .env}
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://aivault:${POSTGRES_PASSWORD:?}@postgres:5432/aivault
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    # Amazon S3, one private bucket per environment, reached with that
    # environment's own access keys (scoped to its bucket only).
    OBJECT_STORAGE_ENDPOINT_URL: ""
    OBJECT_STORAGE_SECURE: "true"
    OBJECT_STORAGE_BUCKET: ${ARCHIVE_BUCKET:?}
    AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-2}
    # Everything that names the public address derives from PUBLIC_URL, so
    # changing the domain is a one-line change (plus PUBLIC_HOST).
    FRONTEND_URL: ${PUBLIC_URL:?}
    CORS_ALLOW_ORIGINS: ${PUBLIC_URL}
    GOOGLE_WORKSPACE_REDIRECT_URI: ${PUBLIC_URL}/connectors/google/callback
    COOKIE_SECURE: "true"
    ARCHIVE_TEMP_DIR: /archive-tmp
    # In the .env for nginx and backup.sh only — the app never gets them.
    ORIGIN_VERIFY_SECRET: ""
    BACKUP_AWS_ACCESS_KEY_ID: ""
    BACKUP_AWS_SECRET_ACCESS_KEY: ""
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aivault
      POSTGRES_USER: aivault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivault -d aivault"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}

  # Brings the database schema up to date, then exits. Every other app
  # service waits for it, so a release never runs against an old schema.
  migrate:
    <<: *app-env
    image: aivault-backend:${IMAGE_TAG:?}
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app-env
    image: aivault-backend:${IMAGE_TAG}
    # Built here by `migrate`, never pulled from a registry.
    pull_policy: never
    # --proxy-headers: the client address comes from `web` (nginx), which
    # sets it; the API is reachable from nothing else.
    command:
      [
        "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
        "--workers", "${API_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "*",
      ]
    volumes:
      # The ~128 MB embedding model, downloaded once rather than on every start.
      - model-cache:/home/vault_app/gensim-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      # The very first start downloads the model before it answers.
      start_period: 300s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}

  worker:
    <<: *app-env
    image: aivault-worker:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command:
      [
        "celery", "-A", "worker.celery_app", "worker", "--loglevel=info",
        "--concurrency", "${WORKER_CONCURRENCY:-2}",
      ]
    volumes:
      # Archives are assembled here before upload; the worker refuses a job
      # that would leave less than ARCHIVE_FREE_SPACE_RESERVE_BYTES free.
      - archive-tmp:/archive-tmp
      - model-cache:/home/vault_app/gensim-data
    # The image's check (`celery inspect ping`) starts a Python process; on a
    # small instance busy building a release that takes longer than 5 s.
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: ${WORKER_MEM_LIMIT:-1536m}

  # Celery Beat: enqueues scheduled work, runs nothing itself. Exactly one
  # per environment — never scale it.
  scheduler:
    <<: *app-env
    image: aivault-worker:${IMAGE_TAG}
    # Built here by `worker`, never pulled from a registry.
    pull_policy: never
    command:
      [
        "celery", "-A", "worker.celery_app", "beat", "--loglevel=info",
        "--schedule", "/tmp/celerybeat-schedule",
      ]
    # The image's check pings a worker, which Beat is not. Beat has nothing to
    # ask, so healthy means its process is alive; `up --wait` (Compose 2.40+)
    # rejects a service whose check is disabled.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: ${SCHEDULER_MEM_LIMIT:-320m}

  web:
    image: aivault-web-${ENVIRONMENT_NAME:?}:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
    environment:
      BACKEND_UPSTREAM: backend:8000
      # Only Caddy, on this network, may tell nginx who the client is.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.30.0.0/24}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
    ports:
      - "127.0.0.1:${WEB_PORT:?}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

  # Terminates HTTPS for PUBLIC_HOST with an automatically renewed Let's
  # Encrypt certificate, so traffic is encrypted all the way to this server.
  edge:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    mem_limit: 128m

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  redis-data:
  archive-tmp:
  model-cache:
  # Certificates and the ACME account, kept so a restart doesn't re-issue.
  caddy-data:
  caddy-config:
