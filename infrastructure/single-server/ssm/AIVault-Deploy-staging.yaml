# SSM Command document: the only thing the staging deploy role may run on
# the server. It deploys one commit to staging and can do nothing else — not
# touch production, not run any other command.
schemaVersion: "2.2"
description: Deploy one commit of AI Vault to the staging environment.
parameters:
  CommitSha:
    type: String
    description: Full 40-character git commit SHA.
    allowedPattern: "^[0-9a-f]{40}$"
mainSteps:
  - action: aws:runShellScript
    name: deploy
    inputs:
      timeoutSeconds: "1800"
      runCommand:
        - /opt/aivault/staging/src/infrastructure/single-server/deploy.sh staging {{ CommitSha }}
