# Local development stack (ADR-009). Run from the repo root:
#   docker compose -f infrastructure/docker/docker-compose.yml up
# Requires a repo-root `.env` — copy `.env.example` first (see README / Phase 1
# manual QA checklist).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Remapped host-side (6380, not 6379) — another project's redis already
    # holds 6379 on this machine. Internal traffic is unaffected: every
    # service here reaches Redis via REDIS_URL's `redis:6379` on the
    # Docker network, never through this host port.
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Archive MVP's object store (ADR — Archive MVP). S3-compatible so
  # ObjectStorageClient works identically against real S3 in production.
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: vault-minio
      MINIO_ROOT_PASSWORD: vault-minio-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://vault:vault@postgres:5432/vault
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://localhost:5173
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: vault-minio
      OBJECT_STORAGE_SECRET_KEY: vault-minio-secret
      OBJECT_STORAGE_BUCKET: vault-archives
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../apps/backend:/workspace/apps/backend
      - ../../packages/shared:/workspace/packages/shared
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://vault:vault@postgres:5432/vault
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: vault-minio
      OBJECT_STORAGE_SECRET_KEY: vault-minio-secret
      OBJECT_STORAGE_BUCKET: vault-archives
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../apps/worker:/workspace/apps/worker
      - ../../packages/shared:/workspace/packages/shared

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/frontend:/workspace/apps/frontend
      - ../../packages/types:/workspace/packages/types
      - ../../packages/config:/workspace/packages/config
      - frontend-node-modules:/workspace/apps/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
  frontend-node-modules:
