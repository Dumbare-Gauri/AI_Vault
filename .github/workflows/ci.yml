name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Phase 10 (ADR-022) — deployment is manual-dispatch only, never automatic
  # on push, and only ever targets a GitHub Environment (below) that the
  # repo owner configures with required reviewers — this workflow can be
  # merged and exist in CI without ever being able to touch a real
  # environment until both the environment's approval gate AND its cloud
  # credentials are set up.
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy (staging or production)"
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  backend:
    name: Backend (lint, typecheck, migrate, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault -d vault"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vault:vault@localhost:5432/vault
      REDIS_URL: redis://localhost:6379/0
      # CI-only dev key so the connector integration tests can exercise real
      # encrypt/decrypt — never used outside this workflow.
      CONNECTOR_ENCRYPTION_KEY: kdvNPNW1oDBDWzrUqgYhZI414BBDPQfomFczRORzD8Y=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # requirements.txt's `-e ../../packages/shared` line is resolved by pip
      # relative to the current working directory, not the requirements
      # file's own location — this install must run with apps/backend as cwd.
      - name: Install dependencies
        working-directory: apps/backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check apps/backend

      - name: Typecheck (mypy)
        working-directory: apps/backend
        run: mypy --config-file ../../packages/config/python/mypy.ini app alembic

      # Phase 10 (ADR-022) — checking packages/shared through the backend's
      # own file paths isn't equivalent to checking it directly: ADR-021 and
      # ADR-022 each found a real mypy strictness gap (dict key types,
      # Sentry integration types) that only surfaced when mypy pointed at
      # vault_shared's own location. Runs once here, not duplicated in the
      # worker job below — same package, same result either way.
      - name: Typecheck packages/shared directly
        working-directory: packages/shared
        run: mypy --config-file ../config/python/mypy.ini vault_shared

      - name: Run migrations against a real Postgres
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Unit + integration tests
        run: pytest tests/unit/backend tests/unit/shared tests/integration/backend -q

  worker:
    name: Worker (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      # Phase 4 added tests/integration/worker (ScannerService against a real
      # Postgres) — the worker job needs the same service containers as the
      # backend job now, not just for its own unit tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault -d vault"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vault:vault@localhost:5432/vault
      REDIS_URL: redis://localhost:6379/0
      CONNECTOR_ENCRYPTION_KEY: kdvNPNW1oDBDWzrUqgYhZI414BBDPQfomFczRORzD8Y=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Migrations live in apps/backend's Alembic setup (there is no separate
      # worker schema) — install just enough of the backend to run them
      # against the same Postgres the worker integration tests will use.
      - name: Install backend dependencies and migrate
        working-directory: apps/backend
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head

      - name: Install dependencies
        working-directory: apps/worker
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check apps/worker

      - name: Typecheck (mypy)
        working-directory: apps/worker
        run: mypy --config-file ../../packages/config/python/mypy.ini worker

      - name: Unit + integration tests
        run: pytest tests/unit/worker tests/unit/shared tests/integration/worker -q

  # Phase 10 (ADR-022) — dependency and secret scanning. Independent of the
  # per-app lint/typecheck/test jobs above so a vulnerable dependency or a
  # committed secret blocks the merge even if the app-level jobs are green.
  security:
    name: Security (dependency + secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: pip-audit (backend)
        working-directory: apps/backend
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt

      - name: pip-audit (worker)
        working-directory: apps/worker
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm audit (frontend)
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker image build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: false
          load: true
          tags: vault-backend:ci

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: false
          load: true
          tags: vault-worker:ci

      - name: Build frontend image (development target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          target: development
          push: false

      - name: Build frontend image (production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          target: production
          push: false
          load: true
          tags: vault-frontend:ci

      # Phase 10 (ADR-022) — scans the images actually built above, not
      # just their source dependency manifests (pip-audit/pnpm audit in the
      # `security` job above catch that layer; this catches OS-package CVEs
      # baked into the base image itself). `exit-code: 1` fails the build on
      # any CRITICAL/HIGH finding; ignore-unfixed skips CVEs with no
      # available fix yet, since failing CI over something nobody can act
      # on is just noise, not safety.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vault-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vault-worker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vault-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  # Phase 10 (ADR-022) — deployment automation skeleton. Only runs on a
  # manual `workflow_dispatch` (never on push/PR — see the `on:` trigger
  # above), and only after every other job in this run has passed
  # (`needs:` below), and only after this run's `target_environment` GitHub
  # Environment approves it (configure required reviewers on the
  # `staging`/`production` Environments in repo Settings — until that's
  # done, dispatching this job just waits forever, which is the safe
  # failure mode). The registry push/terraform apply/rollback steps below
  # are real, complete automation — they simply have no cloud credentials
  # to run against yet in this repo's secrets, so a dispatch today fails
  # fast at the first step that needs one, per Docs/04_DEPLOYMENT_HANDBOOK.md.
  deploy:
    name: Deploy (${{ inputs.target_environment }})
    if: github.event_name == 'workflow_dispatch'
    needs: [frontend, backend, worker, security, docker-build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/vault-backend:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/vault-worker:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          target: production
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/vault-frontend:${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infrastructure/terraform/environments/${{ inputs.target_environment }}
        env:
          TF_VAR_backend_image_tag: ${{ github.sha }}
          TF_VAR_worker_image_tag: ${{ github.sha }}
          TF_VAR_frontend_image_tag: ${{ github.sha }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Post-deploy health check + smoke test
        run: infrastructure/scripts/smoke_test.sh "${{ secrets.DEPLOYED_BASE_URL }}"

  # Runs only if `deploy` was attempted and failed — redeploys the previous
  # known-good image tag rather than leaving a broken deploy live. Needs
  # the same environment approval `deploy` needed, since rolling back is
  # itself a production change.
  rollback:
    name: Rollback (${{ inputs.target_environment }})
    if: failure() && needs.deploy.result == 'failure'
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply (previous release)
        working-directory: infrastructure/terraform/environments/${{ inputs.target_environment }}
        env:
          TF_VAR_backend_image_tag: ${{ secrets.LAST_KNOWN_GOOD_IMAGE_TAG }}
          TF_VAR_worker_image_tag: ${{ secrets.LAST_KNOWN_GOOD_IMAGE_TAG }}
          TF_VAR_frontend_image_tag: ${{ secrets.LAST_KNOWN_GOOD_IMAGE_TAG }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Post-rollback health check
        run: infrastructure/scripts/smoke_test.sh "${{ secrets.DEPLOYED_BASE_URL }}"
