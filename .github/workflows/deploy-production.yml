name: Deploy — Production

# A release PR merged into production: full CI, then a required reviewer
# approves the `production` environment, then production. Release tags the
# commit afterwards, only if this deploy succeeded. Off until the
# repository variable PRODUCTION_DEPLOY_ENABLED is `true`.
on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Production
    needs: [ci]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-to-server.yml
    with:
      environment: production
